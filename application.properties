spring.application.name=ai-notes-generator

server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/notes_generator?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=3600000
jwt.refresh-token-expiry-ms=604800000

# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash

# Upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

logging.level.com.notesgen=INFO
